<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보넥도 아카이브</title>
<meta name="description" content="BOYNEXTDOOR 사진과 영상을 날짜·멤버 조합·착장별로 모아 봅니다.">
<meta name="theme-color" content="#101a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보넥도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--paper:#f2f5fa;--card:#fff;--ink:#101a33;--mute:#5b6784;--line:#d3dbea;--blue:#2c54f0;--chip:#e5eaf5;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 0 24px}
h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-.03em;line-height:1.1;font-weight:800}
header p{margin:8px 0 0;color:#b8c3e0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{font:inherit;font-weight:600;border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:999px;padding:7px 14px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.hint{margin:12px 0 0;font-size:13px;color:#b8c3e0}
:focus-visible{outline:3px solid #7f9bff;outline-offset:2px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:16px 0}
.filters summary{padding:12px 16px;font-weight:700;cursor:pointer}
.fbody{padding:0 16px 16px;display:grid;gap:14px}
.fgroup h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.opt{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;color:var(--mute);font-size:14px}
.link{font:inherit;color:var(--blue);background:none;border:0;cursor:pointer;padding:4px;text-decoration:underline}
.day{margin:0 0 28px}
.day h2{position:sticky;top:0;z-index:2;margin:0 0 10px;padding:8px 0;background:var(--paper);display:flex;align-items:baseline;gap:10px;font-size:30px;letter-spacing:-.03em;font-weight:800}
.day h2 span{font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:inherit;text-decoration:none}
a.tile:hover{border-color:var(--blue)}
.ph{position:relative;aspect-ratio:4/5;background:#dfe6f6;display:grid;place-items:center;color:var(--mute);font-size:13px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:#101a33cc;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.cap{padding:8px 10px 10px;font-size:13px}
.cap b{display:block;font-weight:700}
.tags,.note{margin-top:4px;color:var(--mute)}
.chip:disabled{opacity:.35;cursor:default}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:16px 0 0;padding:14px 16px 16px}
.calhead{font-size:17px;font-weight:800;letter-spacing:-.02em}
.cal .chips{margin-top:10px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--mute);margin:14px 0 4px}
.d{min-height:58px;border:1px solid transparent;border-radius:8px;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa5bf;padding:2px}
.d.has{background:var(--chip);border-color:var(--line);color:var(--ink);cursor:pointer;font-weight:700}
.d[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.d small{font-size:11px;line-height:1}
.sch{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.3;color:var(--blue);font-weight:700;margin-top:2px}
.sch.ann{color:#d6336c}
.sch.air{color:#0f766e}
.d[aria-pressed=true] .sch,.d[aria-pressed=true] .sch.ann,.d[aria-pressed=true] .sch.air{color:#fff}
.msch{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:4px;font-size:14px}
.msch b{margin-right:6px}
.msch small{color:var(--mute);margin-left:6px}
.msch a{color:var(--blue)}
.hint2{color:var(--mute);font-size:13px}
.daypanel{margin:12px 0 0;padding:12px;background:#f7f9ff;border:1px solid var(--line);border-radius:8px}
.daypanel h4{margin:0 0 6px;font-size:15px}
.daypanel .msch{margin:0;padding:0;border:0}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;font-size:12px;color:var(--mute)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
footer{padding:8px 0 40px;color:var(--mute);font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="links" id="links">
      <button class="btn primary" id="install" hidden>앱 설치</button>
    </div>
    <p class="hint" id="iosHint" hidden>아이폰은 Safari 하단의 공유 버튼을 누르고 '홈 화면에 추가'를 선택하세요.</p>
  </div>
</header>

<main class="wrap">
  <section class="cal" aria-label="기간별 보기">
    <div class="calhead" id="calTitle">전체 기간</div>
    <div class="chips" id="yearChips"></div>
    <div class="chips" id="monthChips" hidden></div>
    <div id="calGrid" hidden>
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="days" id="days"></div>
      <div class="daypanel" id="dayPanel" hidden></div>
      <ul class="msch" id="monthAnn" hidden></ul>
      <div class="chips" id="schCats" hidden></div>
      <div class="chips" id="schSubs" hidden></div>
      <div class="chips" id="schSubs2" hidden></div>
      <div class="chips" id="schSubs3" hidden></div>
      <ul class="msch" id="monthSch" hidden></ul>
    </div>
  </section>

  <details class="filters" open>
    <summary id="fsum">필터</summary>
    <div class="fbody">
      <div class="fgroup">
        <h3>멤버 조합 (고른 멤버가 모두 나온 항목)</h3>
        <div class="chips" id="memberChips"></div>
        <label class="opt"><input type="checkbox" id="exact" disabled> 고른 멤버만 나온 항목</label>
      </div>
      <div class="fgroup">
        <h3>착장</h3>
        <div class="chips" id="outfitChips"></div>
      </div>
      <div class="fgroup">
        <h3>종류</h3>
        <div class="chips" id="typeChips"></div>
      </div>
    </div>
  </details>

  <div class="bar"><span id="count"></span><button class="link" id="reset" hidden>필터 초기화</button></div>
  <div id="list"></div>
</main>

<footer class="wrap">팬이 만든 비공식 아카이브입니다. 사진과 영상의 저작권은 각 원작자에게 있습니다.</footer>

<script src="data.js"></script>
<script>
const { site, items } = window.ARCHIVE;
const schedules = window.ARCHIVE.schedules || [];
const scheduleTypes = window.ARCHIVE.scheduleTypes || {};
const anniversaries = window.ARCHIVE.anniversaries || [];
const $ = (id) => document.getElementById(id);
const state = { members: new Set(), outfits: new Set(), type: 'all', exact: false, year: null, month: null, day: null, schCat: null, schSub: null, schSub2: null, schSub3: null, limit: 20 };
let lastKey = '';

function el(tag, props = {}, kids = []) {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
}

/* 머리말 */
document.title = site.title;
$('title').textContent = site.title;
$('subtitle').textContent = site.subtitle;
for (const l of site.links || []) {
  if (!l.url) continue;
  $('links').append(el('a', { className: 'btn', href: l.url, target: '_blank', rel: 'noopener', textContent: l.label }));
}

/* 필터 칩 */
function chip(label, pressed, onClick, count) {
  const b = el('button', { className: 'chip', type: 'button' }, label);
  if (count != null) b.append(el('small', { textContent: count }));
  b.setAttribute('aria-pressed', pressed);
  b.onclick = onClick;
  return b;
}
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); render(); }

function buildFilters() {
  $('memberChips').replaceChildren(...site.members.map((m) =>
    chip(m, state.members.has(m), () => toggle(state.members, m))));

  const counts = {};
  for (const it of items) for (const o of it.outfits || []) counts[o] = (counts[o] || 0) + 1;
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $('outfitChips').replaceChildren(...(names.length ? names.map((o) =>
    chip(o, state.outfits.has(o), () => toggle(state.outfits, o), counts[o])) :
    [el('span', { className: 'hint2', textContent: '아직 착장 태그가 달린 항목이 없어요. data.js의 outfits에 적으면 여기에 나타나요.' })]));

  const types = [['all', '전체'], ['photo', '사진'], ['video', '영상']];
  $('typeChips').replaceChildren(...types.map(([v, t]) =>
    chip(t, state.type === v, () => { state.type = v; render(); })));

  $('exact').disabled = state.members.size === 0;
}
$('exact').onchange = (e) => { state.exact = e.target.checked; render(); };
$('reset').onclick = () => {
  state.members.clear(); state.outfits.clear(); state.type = 'all'; state.exact = false;
  state.year = state.month = state.day = state.schCat = state.schSub = state.schSub2 = state.schSub3 = null;
  $('exact').checked = false; render();
};

function passBase(it) {
  if (state.type !== 'all' && it.type !== state.type) return false;
  const m = it.members || [];
  for (const x of state.members) if (!m.includes(x)) return false;
  if (state.exact && state.members.size && m.length !== state.members.size) return false;
  if (state.outfits.size && !(it.outfits || []).some((o) => state.outfits.has(o))) return false;
  return true;
}

/* 기간(년·월·일) */
const pad = (n) => String(n).padStart(2, '0');
const now = new Date();
const nowYM = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
const itemYMs = [...items.map((i) => i.date), ...schedules.map((x) => x.date)].map((d) => d.slice(0, 7)).sort();
const START = [site.startMonth || '2023-05', ...itemYMs].sort()[0];   // 2023년 5월부터
const END = [nowYM, ...itemYMs].sort().slice(-1)[0];                  // 이번 달까지 자동으로 늘어남

const schedByDay = {};
for (const sc of schedules) {
  const from = new Date(`${sc.date}T00:00:00`);
  const to = new Date(`${sc.end || sc.date}T00:00:00`);
  if (isNaN(from) || isNaN(to)) continue;
  for (const d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    (schedByDay[k] = schedByDay[k] || []).push(sc);
  }
}
const annByDay = {};
for (const a of anniversaries) (annByDay[a.date] = annByDay[a.date] || []).push(a);
const isFilled = (it) => !!(it.url || it.thumb);
const md = (d) => `${+d.slice(5, 7)}.${+d.slice(8)}`;
function schLabel(x) {
  if (x.title) return x.title;
  const codes = [x.from, x.to].filter(Boolean);
  if (codes.length === 2) return codes.join(' ➔ ');
  if (codes.length === 1) return `${x.dir || ''} ${codes[0]}`.trim();
  return [x.sub2, x.sub].filter(Boolean).join(' ') || x.cat || '';
}
const schSubPath = (x) => [x.sub, x.sub2, x.sub3].filter(Boolean).join(' › ');
const daySch = (ds) => (schedByDay[ds] || []).slice().sort((a, b) => (a.cat === '공항' ? 0 : 1) - (b.cat === '공항' ? 0 : 1));
function schRow(x, whenText) {
  const label = schLabel(x);
  const name = x.url ? el('a', { href: x.url, target: '_blank', rel: 'noopener', textContent: label }) : label;
  const row = el('li', {}, whenText ? [el('b', { textContent: whenText })] : []);
  if (schTag(x)) row.append(el('span', { className: 'tag', textContent: schTag(x) }));
  row.append(name);
  const pth = schSubPath(x);
  if (pth && pth !== label) row.append(el('small', { textContent: pth }));
  if (x.note) row.append(el('small', { textContent: x.note }));
  return row;
}
function schTag(x) { return x.cat === '공항' && x.dir ? `공항 ${x.dir}` : (x.cat || ''); }
const subKey = (x) => x.sub || x.dir || '';
function schPath(x) {
  if (x.title || x.from || x.to) return schLabel(x);
  return [x.sub, x.sub2].filter(Boolean).join(' › ') || x.cat || '';
}
const pickSch = (arr) => arr.filter((x) =>
  (!state.schCat || x.cat === state.schCat) &&
  (!state.schSub || subKey(x) === state.schSub) &&
  (!state.schSub2 || x.sub2 === state.schSub2) &&
  (!state.schSub3 || x.sub3 === state.schSub3));

function inPeriod(it) {
  const [y, m] = it.date.split('-');
  if (state.year && +y !== state.year) return false;
  if (state.month && +m !== state.month) return false;
  if (state.day && it.date !== state.day) return false;
  return true;
}

function buildCalendar(base) {
  const count = (f) => base.filter((i) => isFilled(i) && f(i)).length || null;
  const years = [];
  for (let y = +START.slice(0, 4); y <= +END.slice(0, 4); y++) years.push(y);

  $('yearChips').replaceChildren(
    chip('전체 기간', !state.year, () => { state.year = state.month = state.day = null; render(); }),
    ...years.map((y) => chip(`${y}년`, state.year === y,
      () => { state.year = state.year === y ? null : y; state.month = state.day = null; render(); },
      count((i) => +i.date.slice(0, 4) === y)))
  );

  const mc = $('monthChips');
  mc.hidden = !state.year;
  if (state.year) {
    mc.replaceChildren(...Array.from({ length: 12 }, (_, k) => k + 1).map((m) => {
      const ym = `${state.year}-${pad(m)}`;
      const b = chip(`${m}월`, state.month === m,
        () => { state.month = state.month === m ? null : m; state.day = null; render(); },
        count((i) => i.date.startsWith(ym)));
      b.disabled = ym < START || ym > END;
      return b;
    }));
  }

  $('calTitle').textContent = state.day
    ? `${state.year}년 ${state.month}월 ${+state.day.slice(8)}일`
    : state.month ? `${state.year}년 ${state.month}월`
    : state.year ? `${state.year}년` : '전체 기간';

  const dp = $('dayPanel');
  dp.hidden = !state.day;
  if (state.day) {
    const dan = annByDay[state.day] || [];
    const rows = [
      ...dan.map((a) => el('li', {}, [el('span', { className: 'tag', textContent: '기념일' }), a.title])),
      ...daySch(state.day).map((x) => schRow(x, ''))
    ];
    dp.replaceChildren(el('h4', { textContent: `${md(state.day)} 하루 일정 전체 (공항 포함)` }),
      rows.length ? el('ul', { className: 'msch' }, rows) : el('p', { className: 'hint2', textContent: '이 날 등록된 일정이 없어요.' }));
  }

  const grid = $('calGrid');
  grid.hidden = !(state.year && state.month);
  if (grid.hidden) return;

  const ym = `${state.year}-${pad(state.month)}`;
  const first = new Date(state.year, state.month - 1, 1).getDay();
  const last = new Date(state.year, state.month, 0).getDate();
  const perDay = {};
  for (const it of base) if (isFilled(it) && it.date.startsWith(ym)) perDay[it.date] = (perDay[it.date] || 0) + 1;

  const cells = Array.from({ length: first }, () => el('span'));
  for (let d = 1; d <= last; d++) {
    const ds = `${ym}-${pad(d)}`;
    const n = perDay[ds] || 0;
    const sc = daySch(ds);
    const an = annByDay[ds] || [];
    const b = el('button', { type: 'button', className: 'd' }, String(d));
    if (n) b.append(el('small', { textContent: n }));
    for (const a of an) b.append(el('span', { className: 'sch ann', textContent: a.title }));
    for (const x of sc) b.append(el('span', { className: x.cat === '공항' ? 'sch air' : 'sch', textContent: schLabel(x) }));
    b.title = [...an.map((a) => a.title), ...sc.map(schLabel)].join('\n');
    if (n || sc.length || an.length) {
      b.classList.add('has');
      b.setAttribute('aria-pressed', state.day === ds);
      b.onclick = () => { state.day = state.day === ds ? null : ds; render(); };
    } else {
      b.disabled = true;
    }
    cells.push(b);
  }
  $('days').replaceChildren(...cells);

  const annMonth = anniversaries.filter((a) => a.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
  $('monthAnn').hidden = !annMonth.length;
  $('monthAnn').replaceChildren(...annMonth.map((a) => el('li', {}, [el('b', { textContent: md(a.date) }), el('span', { className: 'tag', textContent: '기념일' }), a.title])));

  const inMonth = schedules
    .filter((x) => x.date.slice(0, 7) <= ym && (x.end || x.date).slice(0, 7) >= ym)
    .sort((a, b) => a.date.localeCompare(b.date));
  const cats = [...new Set([...Object.keys(scheduleTypes), ...schedules.map((x) => x.cat).filter(Boolean)])]
    .filter((c) => inMonth.some((x) => x.cat === c));
  if (state.schCat && !cats.includes(state.schCat)) cats.push(state.schCat);
  $('schCats').hidden = !(inMonth.length || state.schCat);
  $('schCats').replaceChildren(
    chip('전체 스케줄', !state.schCat, () => { state.schCat = state.schSub = state.schSub2 = state.schSub3 = null; render(); }),
    ...cats.map((c) => chip(c, state.schCat === c,
      () => { state.schCat = state.schCat === c ? null : c; state.schSub = state.schSub2 = state.schSub3 = null; render(); },
      inMonth.filter((x) => x.cat === c).length || null))
  );

  // 작은 단위, 더 작은 단위 칩 (큰 단위를 고르면 아래로 한 단계씩 나타남)
  const inCat = state.schCat ? inMonth.filter((x) => x.cat === state.schCat) : [];
  const subs = [...new Set(inCat.map(subKey).filter(Boolean))];
  $('schSubs').hidden = !subs.length;
  $('schSubs').replaceChildren(...subs.map((v) => chip(v, state.schSub === v,
    () => { state.schSub = state.schSub === v ? null : v; state.schSub2 = state.schSub3 = null; render(); },
    inCat.filter((x) => subKey(x) === v).length || null)));
  const inSub = state.schSub ? inCat.filter((x) => subKey(x) === state.schSub) : [];
  const subs2 = [...new Set(inSub.map((x) => x.sub2).filter(Boolean))];
  $('schSubs2').hidden = !subs2.length;
  $('schSubs2').replaceChildren(...subs2.map((v) => chip(v, state.schSub2 === v,
    () => { state.schSub2 = state.schSub2 === v ? null : v; state.schSub3 = null; render(); },
    inSub.filter((x) => x.sub2 === v).length || null)));

  const inSub2 = state.schSub2 ? inSub.filter((x) => x.sub2 === state.schSub2) : [];
  const subs3 = [...new Set(inSub2.map((x) => x.sub3).filter(Boolean))];
  $('schSubs3').hidden = !subs3.length;
  $('schSubs3').replaceChildren(...subs3.map((v) => chip(v, state.schSub3 === v,
    () => { state.schSub3 = state.schSub3 === v ? null : v; render(); },
    inSub2.filter((x) => x.sub3 === v).length || null)));

  const list = pickSch(inMonth);
  $('monthSch').hidden = !list.length;
  $('monthSch').replaceChildren(...list.map((x) =>
    schRow(x, x.end && x.end !== x.date ? `${md(x.date)}~${md(x.end)}` : md(x.date))));
}

/* 썸네일 */
function ytThumb(u = '') {
  const m = u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);
  return m ? `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg` : '';
}
function placeholder(it) {
  return el('span', { textContent: it.type === 'video' ? '영상' : '사진' });
}

function tile(it) {
  const m = it.members || [];
  const who = m.length === site.members.length ? `${m.length}명 전체` : m.join(', ');
  const ph = el('div', { className: 'ph' });
  const src = it.thumb || ytThumb(it.url);
  if (src) {
    const img = el('img', { src, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' });
    img.onerror = () => { img.remove(); ph.prepend(placeholder(it)); };
    ph.append(img);
  } else {
    ph.append(placeholder(it));
  }
  if (it.type === 'video') ph.append(el('span', { className: 'badge', textContent: '영상' }));

  const cap = el('div', { className: 'cap' }, [el('b', { textContent: who || '멤버 미표시' })]);
  if ((it.outfits || []).length) cap.append(el('div', { className: 'tags', textContent: it.outfits.join(', ') }));
  if (it.note) cap.append(el('div', { className: 'note', textContent: it.note }));

  const root = it.url
    ? el('a', { className: 'tile', href: it.url, target: '_blank', rel: 'noopener' })
    : el('div', { className: 'tile' });
  root.append(ph, cap);
  return root;
}

const WD = ['일', '월', '화', '수', '목', '금', '토'];
function dayHeading(d) {
  const [y, mo, da] = d.split('-');
  const w = WD[new Date(`${d}T00:00:00`).getDay()];
  return el('h2', {}, [`${mo}.${da}`, el('span', { textContent: `${y}년 ${w}요일` })]);
}

function render() {
  buildFilters();
  const base = items.filter(passBase);
  buildCalendar(base);
  const shown = base.filter(inPeriod).sort((a, b) => b.date.localeCompare(a.date));
  const active = state.members.size + state.outfits.size + (state.type !== 'all') + state.exact + (state.year ? 1 : 0);
  $('fsum').textContent = active ? `필터 (${active}개 적용 중)` : '필터';
  $('reset').hidden = !active;
  $('count').textContent = `사진·영상 ${shown.filter(isFilled).length}개 (빈 칸 ${shown.length - shown.filter(isFilled).length}개)`;

  if (!shown.length) {
    $('list').replaceChildren(el('div', { className: 'empty', textContent: state.day ? '이 날 등록된 사진·영상이 없어요.' : '조건에 맞는 항목이 없어요. 필터를 줄여 보세요.' }));
    return;
  }
  const byDay = new Map();
  for (const it of shown) { if (!byDay.has(it.date)) byDay.set(it.date, []); byDay.get(it.date).push(it); }
  const days = [...byDay];
  const key = [[...state.members], [...state.outfits], state.type, state.exact, state.year, state.month, state.day].join('|');
  if (key !== lastKey) { state.limit = 20; lastKey = key; }
  const more = days.length - state.limit;
  const nodes = days.slice(0, state.limit).map(([d, arr]) =>
    el('section', { className: 'day' }, [dayHeading(d), el('div', { className: 'grid' }, arr.map(tile))]));
  if (more > 0) {
    const b = el('button', { className: 'btn primary', type: 'button', textContent: `더 보기 (${more}일 남음)` });
    b.onclick = () => { state.limit += 20; render(); };
    nodes.push(el('div', { className: 'empty' }, [b]));
  }
  $('list').replaceChildren(...nodes);
}
render();

/* 앱 설치 */
let deferred;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('install').hidden = false; });
$('install').onclick = async () => {
  if (!deferred) return;
  deferred.prompt();
  await deferred.userChoice;
  deferred = null;
  $('install').hidden = true;
};
addEventListener('appinstalled', () => { $('install').hidden = true; });
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $('iosHint').hidden = false;
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
